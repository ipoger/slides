<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "STHeiti", sans-serif; }
    .label { font-size: 23px; font-weight: 600; fill: #6a005f; }
    .main { font-size: 21px; fill: #222; }
    .sub { font-size: 17px; fill: #888; }
    .band { fill: #fafafa; stroke: #e3e3e3; stroke-width: 1.5; }
    .accent { fill: #6a005f; }
  </style>

  <g>
    <rect class="band" x="30" y="14" width="900" height="86" rx="8"/>
    <rect class="accent" x="30" y="14" width="7" height="86" rx="3"/>
    <text class="label" x="58" y="52">产品层</text>
    <text class="main" x="180" y="50">web · headless · sdk · sdk-minimal · acp</text>
    <text class="sub" x="180" y="78">同一套核心，换一层组合包就是另一个产品</text>
  </g>

  <g>
    <rect class="band" x="30" y="112" width="900" height="86" rx="8"/>
    <rect class="accent" x="30" y="112" width="7" height="86" rx="3"/>
    <text class="label" x="58" y="150">扩展面</text>
    <text class="main" x="180" y="148">事件：session · agent · capability</text>
    <text class="sub" x="180" y="176">scope：全局 / 按 agent，扁平不继承</text>
  </g>

  <g>
    <rect class="band" x="30" y="210" width="900" height="86" rx="8"/>
    <rect class="accent" x="30" y="210" width="7" height="86" rx="3"/>
    <text class="label" x="58" y="248">核心循环</text>
    <text class="main" x="180" y="246">session 日志 → 提示词 → LLM → 工具</text>
    <text class="sub" x="180" y="274">turn / step；模型可见即已记录</text>
  </g>

  <g>
    <rect class="band" x="30" y="308" width="900" height="86" rx="8"/>
    <rect class="accent" x="30" y="308" width="7" height="86" rx="3"/>
    <text class="label" x="58" y="346">组装</text>
    <text class="main" x="180" y="344">bundle → cordis.patch.yml → profile</text>
    <text class="sub" x="180" y="372">按 id 替换任意一行配置</text>
  </g>

  <g>
    <rect class="band" x="30" y="406" width="900" height="86" rx="8"/>
    <rect class="accent" x="30" y="406" width="7" height="86" rx="3"/>
    <text class="label" x="58" y="444">底座</text>
    <text class="main" x="180" y="442">Cordis：ctx · inject · events · effect</text>
    <text class="sub" x="180" y="470">没有需要打补丁的特权内核</text>
  </g>
</svg>
