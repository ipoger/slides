<svg xmlns="http://www.w3.org/2000/svg" width="960" height="352" viewBox="0 0 960 352">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "STHeiti", sans-serif; }
    .cap { font-size: 15px; fill: #999; letter-spacing: 1px; }
    .role { font-size: 22px; font-weight: 600; fill: #6a005f; }
    .main { font-size: 19px; fill: #222; }
    .sub { font-size: 16px; fill: #777; }
    .box { fill: #fafafa; stroke: #dcdcdc; stroke-width: 1.5; }
    .chip { fill: #fff; stroke: #6a005f; stroke-width: 1.5; }
    .arrow { stroke: #6a005f; stroke-width: 2; fill: none; }
  </style>

  <text class="cap" x="40" y="34">CONSUMER</text>
  <rect class="box" x="40" y="46" width="250" height="104" rx="8"/>
  <text class="role" x="62" y="86">工具</text>
  <text class="main" x="62" y="116">read / write / bash</text>
  <text class="sub" x="62" y="140">模型能看见的只有它</text>

  <text class="cap" x="355" y="34">SERVICE DEFINITION</text>
  <rect class="box" x="355" y="46" width="250" height="104" rx="8"/>
  <text class="role" x="377" y="86">ctx.fs</text>
  <text class="main" x="377" y="116">稳定的服务键</text>
  <text class="sub" x="377" y="140">schema 不随实现变</text>

  <text class="cap" x="670" y="34">PROVIDER</text>
  <rect class="box" x="670" y="46" width="250" height="104" rx="8"/>
  <text class="role" x="692" y="86">执行世界</text>
  <text class="main" x="692" y="116">本地 / 沙箱 / SSH</text>
  <text class="sub" x="692" y="140">整块可替换</text>

  <line class="arrow" x1="292" y1="98" x2="350" y2="98"/>
  <polygon points="350,98 339,92 339,104" fill="#6a005f"/>
  <line class="arrow" x1="607" y1="98" x2="665" y2="98"/>
  <polygon points="665,98 654,92 654,104" fill="#6a005f"/>

  <text class="cap" x="40" y="210">把 fs + subprocess 一起指向远端沙箱，bash / PTY / LSP 会跟着搬过去</text>

  <g>
    <rect class="chip" x="40" y="232" width="270" height="52" rx="6"/>
    <text class="main" x="60" y="264">dsh-fs-local</text>
  </g>
  <g>
    <rect class="chip" x="330" y="232" width="270" height="52" rx="6"/>
    <text class="main" x="350" y="264">dsh-fs-sandbox</text>
  </g>
  <g>
    <rect class="chip" x="620" y="232" width="300" height="52" rx="6"/>
    <text class="main" x="640" y="264">dsh-fs-ssh（远端）</text>
  </g>

  <text class="sub" x="40" y="330">模型看到的工具不变，变的只是它背后那台机器。</text>
</svg>
